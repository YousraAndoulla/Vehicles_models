name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      APP_DIR: .
      DETECT_WEIGHTS: ./models/detect_best.pt
      SEG_WEIGHTS: ./models/seg_best.pt
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_POSTGRES_URL: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors python-dotenv requests pytest

      - name: Syntax check
        run: |
          python -m py_compile app.py config.py database.py utils.py

      - name: Run tests
        run: |
          pytest -q
